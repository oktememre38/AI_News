<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="description" content="Model çıkışları, araştırma ve Türkiye'den yapay zeka haberleri; günde üç baskı.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Haberleri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap">
<style>
:root {
  --paper: #141a17; --sheet: #1b2320; --ink: #e9efe9; --ink-2: #b3bfb8; --ink-3: #75837b; --rule: #2b3631;
  --spine: #8b85ff; --c-model: #9c97ff; --c-research: #4cc3d9; --c-turkey: #ff6b7f;
  --f-head: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-read: "Literata", Georgia, serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --paper: #f3f5f1; --sheet: #ffffff; --ink: #1d2a24; --ink-2: #4d5b54; --ink-3: #87938c; --rule: #d9dfd8;
  --spine: #4338ca; --c-model: #4338ca; --c-research: #0e7490; --c-turkey: #c8102e;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.7 var(--f-read); -webkit-text-size-adjust: 100%; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--spine); outline-offset: 3px; border-radius: 4px; }

.page { max-width: 1080px; margin: 0 auto; padding: 0 20px 80px; display: grid; grid-template-columns: 250px 1fr; gap: 64px; }

/* left rail: masthead, date, filters */
.rail { position: sticky; top: 0; align-self: start; padding-top: 48px; font-family: var(--f-head); }
.mast { font: 700 30px/1 var(--f-head); letter-spacing: -0.03em; margin: 0; }
.mast span { display: block; color: var(--spine); }
.today { margin: 28px 0 0; padding-top: 18px; border-top: 2px solid var(--ink); }
.today b { display: block; font: 600 20px/1.2 var(--f-head); }
.today p { margin: 4px 0 0; font: 500 14px/1.45 var(--f-head); color: var(--ink-2); }
.cats { list-style: none; margin: 32px 0 0; padding: 0; }
.cats button { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; color: var(--ink-2);
  font: 500 16px/1 var(--f-head); padding: 11px 10px; margin: 0 -10px; border-radius: 8px; cursor: pointer; text-align: left; }
.cats button:hover { background: var(--sheet); color: var(--ink); }
.cats button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: inset 3px 0 0 var(--c, var(--ink)); }
.cats i { width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--ink)); flex: none; }
.cats em { margin-left: auto; font-style: normal; font-size: 14px; color: var(--ink-3); }
.cats .model { --c: var(--c-model); } .cats .research { --c: var(--c-research); } .cats .turkey { --c: var(--c-turkey); }
.theme { margin-top: 28px; border: 1px solid var(--rule); background: none; color: var(--ink-2); font: 500 13px var(--f-head);
  padding: 7px 12px; border-radius: 999px; cursor: pointer; }

/* feed: day → edition → items, hung off a time spine */
main { padding-top: 48px; min-width: 0; }
.day { font: 700 clamp(30px, 5vw, 44px)/1 var(--f-head); letter-spacing: -0.03em; margin: 0 0 8px; }
.day + .ed { margin-top: 18px; }
.day:not(:first-child) { margin-top: 64px; }
.ed { position: relative; padding-left: 34px; }
.ed::before { content: ""; position: absolute; left: 6px; top: 10px; bottom: 0; width: 2px; background: var(--rule); }
.ed-h { position: relative; font: 600 14px/1.3 var(--f-head); color: var(--ink-2); padding: 2px 0 4px; }
.ed-h::before { content: ""; position: absolute; left: -34px; top: 3px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--paper); border: 3px solid var(--spine); }
.ed-h b { color: var(--ink); }
.item { padding: 18px 0 26px; }
.item + .item { border-top: 1px solid var(--rule); }
.cat { font: 600 13px/1 var(--f-head); color: var(--c); display: flex; align-items: center; gap: 8px; }
.cat::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.item.model { --c: var(--c-model); } .item.research { --c: var(--c-research); } .item.turkey { --c: var(--c-turkey); }
.item h3 { font: 600 clamp(21px, 2.8vw, 25px)/1.28 var(--f-head); letter-spacing: -0.015em; margin: 10px 0 10px; text-wrap: balance; }
.item h3 a { text-decoration: none; background: linear-gradient(var(--c), var(--c)) 0 100% / 0 2px no-repeat; transition: background-size .25s; }
.item h3 a:hover { background-size: 100% 2px; }
.item p { margin: 0; color: var(--ink-2); max-width: 62ch; }
.src { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; font: 500 14px var(--f-head); color: var(--ink); text-decoration: none;
  border: 1px solid var(--rule); border-radius: 999px; padding: 6px 12px; background: var(--sheet); }
.src:hover { border-color: var(--c); }
.src svg { width: 12px; height: 12px; }

.new { color: var(--ink); border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 3px 8px; font-weight: 500; margin-left: 4px; }
.empty { padding: 28px; border-radius: 12px; background: var(--sheet); color: var(--ink-2); font: 400 16px/1.6 var(--f-head); }
.empty b { display: block; color: var(--ink); font-size: 19px; margin-bottom: 4px; }
.archive { margin-top: 64px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font: 500 15px var(--f-head); color: var(--ink-2); }
.archive[hidden] { display: none; }
.archive select { font: 500 15px var(--f-head); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); }
footer { margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--rule); font: 400 14px/1.6 var(--f-head); color: var(--ink-3); }

@media (max-width: 820px) {
  .page { grid-template-columns: 1fr; gap: 0; }
  .rail { position: static; padding-top: 28px; }
  .mast { font-size: 26px; }
  .mast span { display: inline; }
  .today { margin-top: 18px; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
  .cats button { width: auto; margin: 0; padding: 9px 12px; background: var(--sheet); }
  .cats button[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: none; }
  .cats button[aria-pressed="true"] em { color: inherit; opacity: .7; }
  .cats button[data-cat="all"] i { display: none; }
  .theme { position: absolute; top: 28px; right: 20px; margin: 0; }
  .page { position: relative; }
  main { padding-top: 40px; }
  .ed { padding-left: 26px; }
  .ed-h::before { left: -26px; }
  .ed::before { left: 6px; }
}
@media (prefers-reduced-motion: reduce) { .item h3 a { transition: none; } }
</style>
</head>
<body>
<div class="page">
  <aside class="rail">
    <h1 class="mast">AI <span>Haberleri</span></h1>
    <div class="today"><b id="date">&nbsp;</b><p id="status">&nbsp;</p></div>
    <ul class="cats" role="list">
      <li><button data-cat="all" aria-pressed="true"><i></i>Tümü<em></em></button></li>
      <li><button data-cat="model" class="model" aria-pressed="false"><i></i>Model ve ürün<em></em></button></li>
      <li><button data-cat="research" class="research" aria-pressed="false"><i></i>Araştırma<em></em></button></li>
      <li><button data-cat="turkey" class="turkey" aria-pressed="false"><i></i>Türkiye<em></em></button></li>
    </ul>
    <button class="theme" id="theme" aria-label="Açık ve koyu tema arasında geç">Tema</button>
  </aside>
  <main>
    <div id="list"></div>
    <div class="archive" id="archiveBox" hidden>
      <label for="archive">Önceki aylar</label>
      <select id="archive"><option value="">Son 30 gün</option></select>
    </div>
    <footer>Sabah, öğle ve akşam bir Claude görevi yeni haberleri arar, önemli olanları kısa Türkçe özetlerle ekler. Haberlerin içeriği kendi kaynaklarına aittir.</footer>
  </main>
</div>
<script>
const CAT = { model: "Model ve ürün", research: "Araştırma", turkey: "Türkiye" };
const TZ = "Europe/Istanbul";
const state = { items: [], cat: "all", checked: null, archived: false };
const $ = s => document.querySelector(s);
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } }
const dayKey = d => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(d);
const hm = d => new Intl.DateTimeFormat("tr-TR", { hour: "2-digit", minute: "2-digit", timeZone: TZ }).format(d);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const edition = iso => { const h = +hm(new Date(iso)).slice(0, 2); return h < 12 ? "Sabah" : h < 18 ? "Öğle" : "Akşam"; };
const ARROW = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3.5 8.5l5-5M4.5 3.5h4v4"/></svg>';

// dark by default; the button switches and remembers
if (store("theme") === "light") document.documentElement.dataset.theme = "light";
$("#theme").onclick = () => {
  const light = document.documentElement.dataset.theme === "light";
  if (light) delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = "light";
  store("theme", light ? "dark" : "light");
};

function header() {
  const now = new Date();
  $("#date").textContent = new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "long", weekday: "long", timeZone: TZ }).format(now);
  if (!state.checked) return;
  const c = new Date(state.checked);
  const when = dayKey(c) === dayKey(now) ? `${edition(state.checked).toLowerCase()}, ${hm(c)}`
    : new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", timeZone: TZ }).format(c);
  $("#status").textContent = `Son baskı ${when}. Günde üç baskı: 08:00, 15:00, 20:00.`;
}

function dayLabel(d) {
  const now = new Date();
  if (d === dayKey(now)) return "Bugün";
  if (d === dayKey(new Date(now - 864e5))) return "Dün";
  return new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "long", timeZone: "UTC" }).format(new Date(d + "T12:00:00Z"));
}

function render() {
  const lastSeen = store("lastSeen");
  for (const b of document.querySelectorAll(".cats button")) {
    const c = b.dataset.cat;
    b.setAttribute("aria-pressed", String(c === state.cat));
    b.querySelector("em").textContent = c === "all" ? state.items.length : state.items.filter(i => i.cat === c).length;
  }
  const items = state.items.filter(i => state.cat === "all" || i.cat === state.cat)
    .sort((a, b) => (b.added + b.date).localeCompare(a.added + a.date));
  if (!items.length) {
    $("#list").innerHTML = state.items.length
      ? '<div class="empty"><b>Bu kategoride haber yok</b>Başka bir kategori seçin ya da sıradaki baskıyı bekleyin.</div>'
      : '<div class="empty"><b>Henüz haber yok</b>İlk baskıdan sonra haberler burada listelenecek.</div>';
    return;
  }
  // group by the day and edition each item was added in
  let html = "", curDay = null, curEd = null;
  for (const it of items) {
    const d = dayKey(new Date(it.added)), ed = d + edition(it.added);
    if (d !== curDay) {
      if (curEd) html += "</section>";
      curDay = d; curEd = null;
      html += `<h2 class="day">${dayLabel(d)}</h2>`;
    }
    if (ed !== curEd) {
      if (curEd) html += "</section>";
      curEd = ed;
      html += `<section class="ed"><div class="ed-h"><b>${edition(it.added)} baskısı</b>, ${hm(new Date(it.added))}</div>`;
    }
    const isNew = !state.archived && lastSeen && it.added > lastSeen;
    html += `<article class="item ${esc(it.cat)}">
      <div class="cat">${esc(CAT[it.cat] || it.cat)}${isNew ? '<span class="new">Yeni</span>' : ""}</div>
      <h3><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></h3>
      <p>${esc(it.summary)}</p>
      <a class="src" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.source)} ${ARROW}</a>
    </article>`;
  }
  $("#list").innerHTML = html + "</section>";
}
for (const b of document.querySelectorAll(".cats button")) b.onclick = () => { state.cat = b.dataset.cat; render(); };

async function getJSON(p) { const r = await fetch(p, { cache: "no-store" }); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }
async function loadLive() {
  const data = await getJSON("news.json");
  state.items = data.items; state.checked = data.checked; state.archived = false;
  header(); render();
}

(async function init() {
  header();
  try { await loadLive(); }
  catch (e) {
    $("#status").textContent = "Haberler yüklenemedi (" + e.message + "). Sayfayı yenileyin.";
    return;
  }
  setTimeout(() => state.checked && store("lastSeen", state.checked), 4000);
  try {
    const months = await getJSON("archive/index.json");
    if (months.length) {
      const sel = $("#archive");
      for (const m of months) {
        const o = document.createElement("option"); o.value = m;
        o.textContent = new Intl.DateTimeFormat("tr-TR", { month: "long", year: "numeric", timeZone: "UTC" }).format(new Date(m + "-15T12:00:00Z"));
        sel.append(o);
      }
      $("#archiveBox").hidden = false;
      sel.onchange = async () => {
        if (!sel.value) return loadLive();
        state.items = await getJSON(`archive/${sel.value}.json`); state.archived = true;
        render(); scrollTo({ top: 0 });
      };
    }
  } catch { }
})();
</script>
</body>
</html>
